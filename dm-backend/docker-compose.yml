services:
  dm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7847:7847"
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7847/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
