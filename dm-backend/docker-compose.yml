services:
  dm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7847:7847"
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7847/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dm_backend
      POSTGRES_PASSWORD: dm_backend
      POSTGRES_DB: dm_backend
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend
    # No ports exposed to host — only accessible within the 'backend' network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:

volumes:
  pgdata:
