name: Build & Push dm-notifier

on:
  push:
    branches: [main]
    paths:
      - 'dm-notifier/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./dm-notifier
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dm-notifier:latest
            ghcr.io/${{ github.repository_owner }}/dm-notifier:${{ github.sha }}
